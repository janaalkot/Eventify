server.port=${SERVER_PORT:8084}
spring.application.name=notification-service

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notification_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

security.jwt.secret=${JWT_SECRET:cmVwbGFjZS10aGlzLXNlY3JldC12aWEtZW52LWJlZm9yZS1wcm9kdWN0aW9uLXVzZS0xMjM0NTY3ODkwMTIzNDU2Nzg5MA==}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
